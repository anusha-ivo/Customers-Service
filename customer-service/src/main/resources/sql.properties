
# ADDRESS

address.insert=INSERT INTO customer_addresses (customer_id, label, line1, line2, city, state, country, postal_code, is_default) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)

address.unsetDefault=UPDATE customer_addresses SET is_default = false WHERE customer_id = ?

address.update=UPDATE customer_addresses SET label = ?, line1 = ?, line2 = ?, city = ?, state = ?, country = ?, postal_code = ?, is_default = ? WHERE address_id = ? AND customer_id = ?

address.isDefault=SELECT is_default FROM customer_addresses WHERE address_id = ?

address.countByCustomerId=SELECT COUNT(*) FROM customer_addresses WHERE customer_id = ?

address.delete=DELETE FROM customer_addresses WHERE address_id = ?

address.existsByIdAndCustomerId=SELECT COUNT(*) FROM customer_addresses WHERE address_id = ? AND customer_id = ?

address.findByCustomerId=SELECT address_id, label, line1, line2, city, state, country, postal_code, is_default FROM customer_addresses WHERE customer_id = ?

address.markAsDefault=UPDATE customer_addresses SET is_default = true WHERE address_id = ?

address.findById=SELECT address_id, customer_id, label, line1, line2, city, state, country, postal_code, is_default FROM customer_addresses WHERE address_id = ?

# CUSTOMER

customer.insert=INSERT INTO customers (name, email, phone) VALUES (?, ?, ?)

customer.update=UPDATE customers SET name = ?, email = ?, phone = ? WHERE customer_id = ?

customer.delete=DELETE FROM customers WHERE customer_id = ?

customer.existsByEmail=SELECT COUNT(*) FROM customers WHERE email = ?

customer.existsByPhone=SELECT COUNT(*) FROM customers WHERE phone = ?

customer.existsByEmailForOther=SELECT COUNT(*) FROM customers WHERE email = ? AND customer_id <> ?

customer.existsByPhoneForOther=SELECT COUNT(*) FROM customers WHERE phone = ? AND customer_id <> ?

customer.existsById=SELECT COUNT(*) FROM customers WHERE customer_id = ?

customer.findById=SELECT customer_id, name, email, phone, created_at, updated_at FROM customers WHERE customer_id = ?